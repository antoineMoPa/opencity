[package]
name = "opencity"
version = "0.1.0"
edition = "2021"
description = "Parser and writer for the OpenCity road definition language"
license = "Apache-2.0"

[lib]
path = "src/lib.rs"

[features]
editor = ["dep:eframe", "dep:egui_extras", "dep:rfd", "dep:muda", "dep:serde_json", "dep:base64", "dep:png"]

[[bin]]
name = "editor"
path = "src/bin/editor.rs"
required-features = ["editor"]

[dependencies]
eframe = { version = "0.36", default-features = false, features = ["default_fonts", "glow", "x11", "wayland"], optional = true }
egui_extras = { version = "0.36", features = ["svg"], optional = true }
rfd = { version = "0.17", optional = true }
serde_json = { version = "=1.0.151", optional = true }
base64 = { version = "0.22", optional = true }
png = { version = "0.17", optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
muda = { version = "0.19", default-features = false, optional = true }
