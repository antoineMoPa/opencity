<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#181d25">
  <link rel="icon" href="./favicon.svg" type="image/svg+xml">
  <title>OpenCity Roads</title>
  <style>
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #181d25; }
    #opencity-canvas { display: block; width: 100%; height: 100%; outline: none; }
    #loading { position: fixed; inset: 0; display: grid; place-items: center; color: #edf2f4; font: 16px system-ui, sans-serif; background: #181d25; }
    #loading[hidden] { display: none; }
    #loading.error { padding: 2rem; text-align: center; color: #ffb8a0; }
  </style>
</head>
<body>
  <canvas id="opencity-canvas" aria-label="OpenCity road editor"></canvas>
  <div id="loading" role="status">Loading OpenCity…</div>
  <script type="module">
    import init, { WebHandle } from './pkg/opencity.js';

    const loading = document.getElementById('loading');
    try {
      await init();
      const app = new WebHandle();
      await app.start(document.getElementById('opencity-canvas'));
      loading.hidden = true;
      window.opencityApp = app;
    } catch (error) {
      console.error('OpenCity failed to start', error);
      loading.classList.add('error');
      loading.textContent = `OpenCity could not load: ${error}`;
    }
  </script>
</body>
</html>
